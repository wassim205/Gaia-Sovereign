services:
  db:
    image: postgres:15-alpine
    container_name: gaiasovereign-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-gaia_sovereign}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: gaiasovereign-api
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://postgres:password@db:5432/gaia_sovereign"
      BACKEND_PORT: 4000
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    develop:
      watch:
        - path: ./apps/api/src
          target: /app/src
          action: sync+restart
        - path: ./apps/api/package.json
          target: /app/package.json
          action: rebuild

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: gaiasovereign-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
      NEXT_PUBLIC_API_BASE: "http://localhost:4000"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      NODE_ENV: "development"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    restart: unless-stopped
    develop:
      watch:
        - path: ./apps/web/app
          target: /app/app
          action: sync+restart
        - path: ./apps/web/components
          target: /app/components
          action: sync+restart
        - path: ./apps/web/lib
          target: /app/lib
          action: sync+restart
        - path: ./apps/web/package.json
          target: /app/package.json
          action: rebuild

volumes:
  db_data: