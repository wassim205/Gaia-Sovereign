name: Backend CI

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/backend-ci.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches:
      - dev
      - main
    paths:
      - 'apps/api/**'
      - '.github/workflows/backend-ci.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

jobs:
  backend-checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: gaia_sovereign_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/gaia_sovereign_ci
      BACKEND_PORT: 4000
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret
      JWT_EXPIRES_IN: 1d
      NEXT_PUBLIC_API_URL: http://localhost:4000

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Run migrations
        run: pnpm prisma migrate deploy

      - name: Seed database
        run: pnpm db:seed

      - name: Lint
        run: pnpm lint

      - name: Unit tests with coverage
        run: pnpm test:cov

      - name: Validate OpenAPI specification
        run: pnpm docs:validate

      - name: E2E tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      - name: Coverage summary
        run: |
          node -e "const fs=require('fs');const p='./coverage/coverage-summary.json';if(!fs.existsSync(p)){console.log('coverage-summary.json not found');process.exit(0);}const s=JSON.parse(fs.readFileSync(p,'utf8')).total;const line='### Backend Coverage\\n\\n| Metric | % |\\n|---|---:|\\n| Lines | '+s.lines.pct+' |\\n| Statements | '+s.statements.pct+' |\\n| Functions | '+s.functions.pct+' |\\n| Branches | '+s.branches.pct+' |\\n';fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,line);"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/api/coverage
          if-no-files-found: error
