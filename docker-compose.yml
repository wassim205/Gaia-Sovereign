services:
  db:
    image: postgres:15-alpine
    container_name: gaia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-gaia_sovereign}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gaia-network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: gaia-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-gaia_sovereign}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      BACKEND_PORT: 4000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gaia-network

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: gaia-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:4000/api
    depends_on:
      - api
    networks:
      - gaia-network

volumes:
  db_data:

networks:
  gaia-network:
    driver: bridge